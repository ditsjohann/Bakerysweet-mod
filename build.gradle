plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bakery" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"bakery_gametest" {
			sourceSet sourceSets.gametest
		}
	}

	// In-game automated tests: ./gradlew runGametest starts a headless server, runs every test and exits.
	runs {
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-report.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
		// Dev only: opens the "bakery_showcase" world, runs run/showcase.txt (commands, camera moves, screenshots) and quits.
		showcase {
			client()
			name "Showcase"
			vmArg "-Dbakery.showcase=showcase.txt"
			programArgs "--quickPlaySingleplayer", "bakery_showcase", "--width", "1280", "--height", "720"
			runDir "run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
